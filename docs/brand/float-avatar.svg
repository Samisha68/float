<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-label="Float">
  <!-- Float social avatar · 400x400 · black ground, white mark.
       Upload as a square: X/Twitter crops to a circle. The mark is sized to stay
       inside the inscribed circle, so the cornices never clip. -->
  <rect width="400" height="400" fill="#000000"/>
  <g transform="translate(80 131.5) scale(1.846)">
    <g fill="#FFFFFF" transform="translate(-2 -18)">
      <path fill-rule="evenodd" d="
        M8,88 V56 H54 V42 H90 V28 H126 V88 Z
        M18,88 V77 A13,13 0 0 1 44,77 V88 Z
        M54,88 V63 A13,13 0 0 1 80,63 V88 Z
        M90,88 V49 A13,13 0 0 1 116,49 V88 Z"/>
      <rect x="4"  y="50" width="54" height="7"/>
      <rect x="50" y="36" width="44" height="7"/>
      <rect x="86" y="22" width="44" height="7"/>
    </g>
  </g>
</svg>
