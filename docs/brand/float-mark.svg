<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 18 130 74" role="img" aria-label="Float">
  <!-- Float · The Ascending Arcade.
       Three Roman bays, each opening taller than the last, cornice over each level.
       No base by design. Uses currentColor: set `color` on the parent to recolor. -->
